services:

  # Local OIDC provider standing in for Google/Facebook/Apple during local runs and
  # integration tests. Issuer: http://localhost:8090/default from your machine, and
  # http://mock-oauth2-server:8080/default from other containers on this network.
  mock-oauth2-server:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.2
    container_name: mock_oauth2_server
    ports:
      - "8090:8080" # Maps port 8080 inside container to 8090 on your host machine
    environment:
      LOG_LEVEL: "debug"
      # interactiveLogin shows a small sign-in form: whatever you type as the username
      # becomes the `sub` claim (a new username = a new account in the app), and the
      # optional claims box takes JSON such as {"email":"me@example.com","name":"Me"}.
      JSON_CONFIG: >-
        { "interactiveLogin": true }

  # Your Application Service
  bass-strings-database:
    image: bass-strings-database:latest
    build: .                 # Builds the Dockerfile in the current directory
    ports:
      - "8080:8080" # Application port
      - "5005:5005" # Debugging port
    environment:
      # suspend=n so the app starts without waiting for a debugger; attach to 5005 any time.
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
      - SPRING_MONGODB_URI=mongodb://rootuser:rootpass@mongodb:27017/myapp?authSource=admin
      # Sign in through mock-oauth2-server. The app reaches it by its service name, but your
      # browser can't resolve that name, so the authorization redirect uses localhost:8090.
      - MOCK_OAUTH2_ENABLED=true
      - MOCK_OAUTH2_ISSUER_URI=http://mock-oauth2-server:8080/default
      - MOCK_OAUTH2_AUTHORIZATION_URI=http://localhost:8090/default/authorize
    depends_on:
      - mock-oauth2-server
      - mongodb              # Ensures the database starts before your app


  # MongoDB Service
  mongodb:
    image: mongo:latest      # Uses the official MongoDB image from Docker Hub
    container_name: mongodb_container
    restart: unless-stopped
    ports:
      - "27017:27017"        # Exposes MongoDB to your local machine
    environment:
      - MONGO_INITDB_ROOT_USERNAME=rootuser
      - MONGO_INITDB_ROOT_PASSWORD=rootpass
    volumes:
      # Persistent Database Directory:
      # Maps a local folder './mongo-data' to the container's internal data folder
      - ./mongo-data:/data/db

  # Named volumes are not needed here because we are using a direct local folder bind mount
